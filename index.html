<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 스토리 채팅 스튜디오</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #141417;
      --surface-2: #1e1e24;
      --border: #2c2c35;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --ok: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .char-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .char-text { min-width: 0; }
    .char-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .char-name {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .turn-badge {
      font-size: 11px;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.18);
      padding: 1px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .char-desc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      transition: 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #282832;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .char-bar {
      background: #101014;
      border-bottom: 1px solid var(--border);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .char-chip {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .char-chip.active {
      background: rgba(99, 102, 241, 0.22);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-group.user { align-items: flex-end; }
    .msg-group.assistant { align-items: flex-start; }

    .bubble {
      max-width: 86%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.58;
      word-break: break-word;
    }

    .msg-group.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-group.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .narration {
      display: block;
      color: #a1a1aa;
      font-style: italic;
      font-size: 13px;
      margin: 4px 0;
    }

    .dialogue {
      white-space: pre-wrap;
    }

    .sub-actions {
      display: flex;
      gap: 8px;
      padding: 0 4px;
    }

    .link-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11px;
      padding: 2px 4px;
    }

    .link-btn:hover { color: var(--text); background: transparent; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      max-width: 92%;
    }

    .suggestion-chip {
      background: #171722;
      border: 1px solid #32324a;
      color: #c7d2fe;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 10px;
      text-align: left;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.16);
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .input-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 110px;
      line-height: 1.4;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .send-btn {
      height: 42px;
      padding: 0 16px;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 88dvh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal h2 { font-size: 16px; }
    .modal label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .modal input, .modal textarea, .modal select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      font-family: inherit;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }

    .memory-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #d4d4d8;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="char-info">
      <div class="avatar" id="headerAvatar">🌙</div>
      <div class="char-text">
        <div class="char-name-row">
          <span class="char-name" id="headerName">서연</span>
          <span class="turn-badge" id="turnBadge">0턴</span>
        </div>
        <div class="char-desc" id="headerDesc">심야 편의점 야간 알바생</div>
      </div>
    </div>
    <div class="header-actions">
      <button onclick="openMemoryModal()">기억</button>
      <button onclick="openCharModal()">+ 캐릭터</button>
      <button onclick="openSettingsModal()">API 설정</button>
      <button onclick="resetCurrentChat()">초기화</button>
    </div>
  </header>

  <div class="char-bar" id="charBar"></div>

  <main id="chatMain"></main>

  <footer>
    <div class="input-wrap">
      <textarea
        id="msgInput"
        rows="1"
        placeholder="대사나 *행동 묘사*를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"
      ></textarea>
      <button class="btn-primary send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
    </div>
  </footer>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h2>API 및 모델 설정</h2>
      <label>
        Gemini API 키
        <input type="password" id="apiKeyInput" placeholder="AIza..." />
      </label>
      <label>
        모델 선택
        <select id="modelSelect">
          <option value="gemini-2.5-flash">gemini-2.5-flash (빠르고 무료 티어 적합)</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro (정교한 스토리/연출)</option>
        </select>
      </label>
      <p class="hint">
        키는 이 브라우저의 로컬 저장소에만 보관되며 외부 서버로 전송되지 않습니다.
        대화가 8턴 쌓일 때마다 핵심 기억이 자동으로 요약되어 저장됩니다.
      </p>
      <div class="modal-footer">
        <button onclick="closeModal('settingsModal')">닫기</button>
        <button class="btn-primary" onclick="saveSettings()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="charModal">
    <div class="modal">
      <h2>새 스토리 캐릭터 만들기</h2>
      <label>
        이모지
        <input type="text" id="newCharEmoji" value="⚔️" maxlength="4" />
      </label>
      <label>
        이름
        <input type="text" id="newCharName" placeholder="예: 카엘" />
      </label>
      <label>
        역할 / 한 줄 소개
        <input type="text" id="newCharDesc" placeholder="예: 폐허가 된 수도의 과묵한 방랑 검사" />
      </label>
      <label>
        성격 및 말투
        <textarea id="newCharPersona" rows="3" placeholder="예: 말이 적고 직설적이지만 약속은 목숨처럼 지킨다. 반말을 쓴다."></textarea>
      </label>
      <label>
        세계관 / 현재 상황
        <textarea id="newCharWorld" rows="2" placeholder="예: 붉은 달이 뜬 밤, 낡은 여관 난로 앞에서 마주 앉은 상황."></textarea>
      </label>
      <label>
        첫 인사말 & 상황 묘사 (*지문*과 "대사")
        <textarea id="newCharOpening" rows="3" placeholder='예: *장작이 타닥거리며 튄다. 칼자루를 만지작거리던 그가 시선을 든다.*\n\n"아직 안 잤나. 밖엔 위험한 것들이 돌아다녀."'></textarea>
      </label>
      <div class="modal-footer">
        <button onclick="closeModal('charModal')">취소</button>
        <button class="btn-primary" onclick="createCharacter()">추가하고 대화하기</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="memoryModal">
    <div class="modal">
      <h2>캐릭터 장기 기억 노트</h2>
      <p class="hint">대화가 길어져도 캐릭터가 잊지 않도록 핵심 사건과 설정을 요약해 보관합니다. 직접 수정할 수도 있습니다.</p>
      <textarea id="memoryEditor" rows="7" class="memory-box"></textarea>
      <div class="modal-footer">
        <button onclick="closeModal('memoryModal')">닫기</button>
        <button class="btn-primary" onclick="saveMemoryManual()">기억 저장</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ai_story_studio_v1";

    const DEFAULT_CHARACTERS = [
      {
        id: "seoyeon",
        emoji: "🌙",
        name: "서연",
        desc: "심야 편의점 야간 알바생",
        persona:
          "겉으로는 무심하고 피곤해 보이지만 호기심이 많고 은근히 잘 챙겨준다. 반말과 존댓말을 섞어 쓰는 편한 구어체를 쓴다.",
        world:
          "비 오는 날 새벽 2시, 한적한 주택가 골목의 24시간 편의점. 은은한 형광등과 컵라면 냄새가 감돈다.",
        opening:
          '*새벽 2시, 편의점 자동문이 띠링 소리를 내며 열린다. 계산대 앞에서 턱을 괴고 졸고 있던 서연이 고개를 번쩍 들더니, 잠이 덜 깬 눈으로 당신을 바라본다.*\n\n"어, 어서 오세요... 아, 이 시간에 손님 진짜 오랜만이네. 뭐 찾으시는 거 있어요?"'
      },
      {
        id: "aria",
        emoji: "🔮",
        name: "아리아",
        desc: "심연의 기록을 파는 골동품 상인",
        persona:
          "차분하고 신비로우며 비밀을 쥐고 있는 듯한 말투를 쓴다. 상대의 선택과 감정을 흥미롭게 관찰한다.",
        world:
          "향초 냄새와 오래된 양피지, 멈춘 시계들이 가득한 지하 골동품 가게.",
        opening:
          '*작은 종소리가 울리며 무거운 나무 문이 닫힌다. 촛불 아래에서 낡은 책장을 넘기던 아리아가 천천히 고개를 들어 당신을 응시한다.*\n\n"이곳을 찾아오는 사람은 둘 중 하나야. 잃어버린 기억을 되찾고 싶거나, 잊고 싶은 무언가가 있거나. 당신은 어느 쪽이지?"'
      }
    ];

    let state = {
      apiKey: "",
      model: "gemini-2.5-flash",
      activeCharId: "seoyeon",
      characters: DEFAULT_CHARACTERS,
      sessions: {}
    };

    let isGenerating = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            characters: parsed.characters?.length ? parsed.characters : DEFAULT_CHARACTERS,
            sessions: parsed.sessions || {}
          };
        }
      } catch (e) {
        console.error("로드 오류:", e);
      }

      for (const ch of state.characters) {
        if (!state.sessions[ch.id]) {
          state.sessions[ch.id] = {
            messages: [{ role: "assistant", content: ch.opening, suggestions: [] }],
            memory: ""
          };
        }
      }
      if (!state.characters.some((c) => c.id === state.activeCharId)) {
        state.activeCharId = state.characters[0].id;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getActiveChar() {
      return state.characters.find((c) => c.id === state.activeCharId) || state.characters[0];
    }

    function getActiveSession() {
      const ch = getActiveChar();
      if (!state.sessions[ch.id]) {
        state.sessions[ch.id] = {
          messages: [{ role: "assistant", content: ch.opening, suggestions: [] }],
          memory: ""
        };
      }
      return state.sessions[ch.id];
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatStoryHtml(rawText) {
      const safe = escapeHtml(rawText || "");
      const parts = safe.split(/(\*[^*]+\*)/g);
      return parts
        .map((part) => {
          if (!part) return "";
          if (part.startsWith("*") && part.endsWith("*") && part.length > 2) {
            return `<span class="narration">${part.slice(1, -1)}</span>`;
          }
          return `<span class="dialogue">${part}</span>`;
        })
        .join("");
    }

    function renderAll() {
      const ch = getActiveChar();
      const session = getActiveSession();
      const userTurns = session.messages.filter((m) => m.role === "user").length;

      document.getElementById("headerAvatar").textContent = ch.emoji;
      document.getElementById("headerName").textContent = ch.name;
      document.getElementById("headerDesc").textContent = ch.desc;
      document.getElementById("turnBadge").textContent = `${userTurns}턴`;

      const bar = document.getElementById("charBar");
      bar.innerHTML = "";
      for (const item of state.characters) {
        const btn = document.createElement("button");
        btn.className = `char-chip ${item.id === ch.id ? "active" : ""}`;
        btn.textContent = `${item.emoji} ${item.name}`;
        btn.onclick = () => {
          if (isGenerating) return;
          state.activeCharId = item.id;
          saveState();
          renderAll();
        };
        bar.appendChild(btn);
      }

      const main = document.getElementById("chatMain");
      main.innerHTML = "";

      session.messages.forEach((msg, idx) => {
        const group = document.createElement("div");
        group.className = `msg-group ${msg.role}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = formatStoryHtml(msg.content || "...");
        group.appendChild(bubble);

        const isLastAssistant =
          msg.role === "assistant" && idx === session.messages.length - 1 && idx > 0 && !isGenerating;

        if (isLastAssistant) {
          const actions = document.createElement("div");
          actions.className = "sub-actions";

          const rerollBtn = document.createElement("button");
          rerollBtn.className = "link-btn";
          rerollBtn.textContent = "↻ 다시 생성";
          rerollBtn.onclick = () => rerollLast();
          actions.appendChild(rerollBtn);

          group.appendChild(actions);

          if (msg.suggestions && msg.suggestions.length > 0) {
            const sugWrap = document.createElement("div");
            sugWrap.className = "suggestions";
            msg.suggestions.forEach((sug) => {
              const sBtn = document.createElement("button");
              sBtn.className = "suggestion-chip";
              sBtn.textContent = sug;
              sBtn.onclick = () => {
                if (isGenerating) return;
                document.getElementById("msgInput").value = sug;
                sendMessage();
              };
              sugWrap.appendChild(sBtn);
            });
            group.appendChild(sugWrap);
          }
        }

        main.appendChild(group);
      });

      main.scrollTop = main.scrollHeight;
      document.getElementById("sendBtn").disabled = isGenerating;
    }

    function buildSystemInstruction(ch, memory) {
      return `당신은 인터랙티브 스토리 채팅 캐릭터 '${ch.name}'입니다.

[캐릭터 정보]
- 이름: ${ch.name}
- 역할: ${ch.desc}
- 성격 및 말투: ${ch.persona}
- 배경/세계관: ${ch.world}

[핵심 장기 기억]
${memory || "아직 요약된 과거 기록이 없습니다."}

[출력 규칙]
1. 행동·표정·분위기 묘사는 *별표*로 감싸고, 대사는 "큰따옴표"로 작성하세요.
2. AI라는 사실을 절대 언급하지 말고 캐릭터에 몰입하세요.
3. 지문과 대사를 합쳐 3~6문장 내외로 몰입감 있게 답하세요.
4. 응답 맨 마지막 줄에는 사용자가 고를 수 있는 짧은 다음 행동/대사 2개를 아래 형식으로만 덧붙이세요:
[선택지: 첫 번째 제안 | 두 번째 제안]`;
    }

    function parseSuggestions(rawText) {
      const match = rawText.match(/\[선택지:\s*([^\]]+)\]\s*$/);
      if (!match) return { cleanText: rawText.trim(), suggestions: [] };
      const cleanText = rawText.replace(match[0], "").trim();
      const suggestions = match[1]
        .split("|")
        .map((s) => s.trim())
        .filter(Boolean)
        .slice(0, 3);
      return { cleanText, suggestions };
    }

    async function callGeminiStream(ch, session, historyForModel, onChunk) {
      if (!state.apiKey) {
        openSettingsModal();
        throw new Error("API 키가 설정되지 않았습니다.");
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
        state.model
      )}:streamGenerateContent?alt=sse&key=${encodeURIComponent(state.apiKey)}`;

      const contents = historyForModel.slice(-16).map((m) => ({
        role: m.role === "user" ? "user" : "model",
        parts: [{ text: m.content }]
      }));

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: buildSystemInstruction(ch, session.memory) }]
          },
          contents,
          generationConfig: {
            temperature: 0.85
          }
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`API 오류 (${res.status}): ${errText.slice(0, 140)}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const jsonStr = trimmed.slice(5).trim();
          if (!jsonStr || jsonStr === "[DONE]") continue;
          try {
            const parsed = JSON.parse(jsonStr);
            const delta =
              parsed?.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "";
            if (delta) {
              fullText += delta;
              onChunk(fullText);
            }
          } catch {}
        }
      }

      return fullText;
    }

    async function updateMemoryIfNeeded(ch, session) {
      const userCount = session.messages.filter((m) => m.role === "user").length;
      if (userCount === 0 || userCount % 8 !== 0) return;

      const recentSlice = session.messages
        .slice(-12)
        .map((m) => `${m.role === "user" ? "유저" : ch.name}: ${m.content}`)
        .join("\n");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
        state.apiKey
      )}`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  {
                    text: `기존 장기 기억:\n${session.memory || "없음"}\n\n최근 대화:\n${recentSlice}\n\n위 내용을 바탕으로 캐릭터 '${ch.name}'이 앞으로 꼭 기억해야 할 유저 정보, 사건, 관계 변화를 4줄 이내의 짧은 불릿으로 갱신해 주세요.`
                  }
                ]
              }
            ]
          })
        });
        if (res.ok) {
          const data = await res.json();
          const summary = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
          if (summary) {
            session.memory = summary;
            saveState();
          }
        }
      } catch (e) {
        console.error("기억 요약 실패:", e);
      }
    }

    async function generateReply(baseMessages) {
      const ch = getActiveChar();
      const session = getActiveSession();

      isGenerating = true;
      session.messages = [...baseMessages, { role: "assistant", content: "", suggestions: [] }];
      renderAll();

      try {
        const rawStreamed = await callGeminiStream(ch, session, baseMessages, (partial) => {
          const { cleanText } = parseSuggestions(partial);
          session.messages[session.messages.length - 1] = {
            role: "assistant",
            content: cleanText,
            suggestions: []
          };
          const main = document.getElementById("chatMain");
          const bubbles = main.querySelectorAll(".msg-group.assistant .bubble");
          const lastBubble = bubbles[bubbles.length - 1];
          if (lastBubble) {
            lastBubble.innerHTML = formatStoryHtml(cleanText || "...");
            main.scrollTop = main.scrollHeight;
          }
        });

        const { cleanText, suggestions } = parseSuggestions(rawStreamed);
        session.messages[session.messages.length - 1] = {
          role: "assistant",
          content: cleanText || "*잠시 침묵이 흐른다.*",
          suggestions
        };
        saveState();
        await updateMemoryIfNeeded(ch, session);
      } catch (err) {
        session.messages[session.messages.length - 1] = {
          role: "assistant",
          content: `*응답을 불러오지 못했다.* (${err.message})`,
          suggestions: []
        };
        saveState();
      } finally {
        isGenerating = false;
        renderAll();
      }
    }

    function sendMessage() {
      if (isGenerating) return;
      const inputEl = document.getElementById("msgInput");
      const text = inputEl.value.trim();
      if (!text) return;

      const session = getActiveSession();
      inputEl.value = "";
      inputEl.style.height = "auto";

      const nextHistory = [...session.messages, { role: "user", content: text }];
      generateReply(nextHistory);
    }

    function rerollLast() {
      if (isGenerating) return;
      const session = getActiveSession();
      if (session.messages.length < 2) return;
      const withoutLast =
        session.messages[session.messages.length - 1].role === "assistant"
          ? session.messages.slice(0, -1)
          : session.messages;
      generateReply(withoutLast);
    }

    function resetCurrentChat() {
      if (isGenerating) return;
      if (!confirm("현재 캐릭터와의 대화를 처음부터 다시 시작할까요?")) return;
      const ch = getActiveChar();
      state.sessions[ch.id] = {
        messages: [{ role: "assistant", content: ch.opening, suggestions: [] }],
        memory: ""
      };
      saveState();
      renderAll();
    }

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function openSettingsModal() {
      document.getElementById("apiKeyInput").value = state.apiKey || "";
      document.getElementById("modelSelect").value = state.model || "gemini-2.5-flash";
      openModal("settingsModal");
    }

    function saveSettings() {
      state.apiKey = document.getElementById("apiKeyInput").value.trim();
      state.model = document.getElementById("modelSelect").value;
      saveState();
      closeModal("settingsModal");
      alert("설정이 저장되었습니다.");
    }

    function openCharModal() {
      document.getElementById("newCharName").value = "";
      document.getElementById("newCharDesc").value = "";
      document.getElementById("newCharPersona").value = "";
      document.getElementById("newCharWorld").value = "";
      document.getElementById("newCharOpening").value = "";
      openModal("charModal");
    }

    function createCharacter() {
      const name = document.getElementById("newCharName").value.trim();
      const desc = document.getElementById("newCharDesc").value.trim() || "스토리 캐릭터";
      const persona =
        document.getElementById("newCharPersona").value.trim() ||
        "개성 있고 몰입감 있게 응답하는 캐릭터";
      const world =
        document.getElementById("newCharWorld").value.trim() || "흥미로운 사건이 시작되는 공간";
      const emoji = document.getElementById("newCharEmoji").value.trim() || "✨";
      const opening =
        document.getElementById("newCharOpening").value.trim() ||
        `*${name}이(가) 조용히 당신을 바라본다.*\n\n"어디서 온 거야? 이야기 좀 해볼까."`;

      if (!name) {
        alert("캐릭터 이름을 입력해 주세요.");
        return;
      }

      const id = `char_${Date.now()}`;
      const newChar = { id, emoji, name, desc, persona, world, opening };
      state.characters.push(newChar);
      state.sessions[id] = {
        messages: [{ role: "assistant", content: opening, suggestions: [] }],
        memory: ""
      };
      state.activeCharId = id;
      saveState();
      closeModal("charModal");
      renderAll();
    }

    function openMemoryModal() {
      const session = getActiveSession();
      document.getElementById("memoryEditor").value = session.memory || "";
      openModal("memoryModal");
    }

    function saveMemoryManual() {
      const session = getActiveSession();
      session.memory = document.getElementById("memoryEditor").value.trim();
      saveState();
      closeModal("memoryModal");
    }

    const msgInput = document.getElementById("msgInput");
    msgInput.addEventListener("input", () => {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadState();
    renderAll();
  </script>
</body>
</html>
